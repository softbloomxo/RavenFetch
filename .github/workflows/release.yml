name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Validate source
        run: |
          python -m py_compile downloader.py
          python downloader.py --version

      - name: Build RavenFetch
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name RavenFetch --collect-all yt_dlp downloader.py

      - name: Download portable runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/RavenFetch.exe package/
          Copy-Item README.md,README.en.md,LICENSE,THIRD_PARTY_NOTICES.md package/

          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive -LiteralPath deno.zip -DestinationPath deno-package
          Copy-Item deno-package/deno.exe package/

          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive -LiteralPath ffmpeg.zip -DestinationPath ffmpeg-package
          $ffmpeg = Get-ChildItem ffmpeg-package -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem ffmpeg-package -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg executables were not found." }
          Copy-Item $ffmpeg.FullName package/ffmpeg.exe
          Copy-Item $ffprobe.FullName package/ffprobe.exe
          Invoke-WebRequest -Uri "https://www.gnu.org/licenses/gpl-3.0.txt" -OutFile package/COPYING.GPLv3.txt
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/denoland/deno/main/LICENSE.md" -OutFile package/DENO-LICENSE.txt

          Compress-Archive -Path package/* -DestinationPath RavenFetch-Windows-x64.zip
          $hash = (Get-FileHash RavenFetch-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RavenFetch-Windows-x64.zip" | Set-Content RavenFetch-Windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            RavenFetch-Windows-x64.zip
            RavenFetch-Windows-x64.zip.sha256
