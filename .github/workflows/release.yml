name: Build and publish single-file Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (example: v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Validate source
        shell: pwsh
        run: |
          python -m py_compile downloader.py
          python downloader.py --version
          $version = python -c "import downloader; print(downloader.APP_VERSION)"
          $releaseTag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.release_tag }}" } else { "${{ github.ref_name }}" }
          if ($releaseTag -ne "v$version") { throw "Tag $releaseTag does not match APP_VERSION $version" }

      - name: Build RavenFetch
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name RavenFetch --collect-all yt_dlp downloader.py

      - name: Prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item dist/RavenFetch.exe RavenFetch.exe
          $hash = (Get-FileHash RavenFetch.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RavenFetch.exe" | Set-Content RavenFetch.exe.sha256
          $version = python -c "import downloader; print(downloader.APP_VERSION)"
          # v0.1.x clients expect this ZIP. Keep it only for the v0.2.0 migration.
          if ($version -eq "0.2.0") {
            Compress-Archive -Path RavenFetch.exe -DestinationPath RavenFetch-Windows-x64.zip
          }

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            RavenFetch*
